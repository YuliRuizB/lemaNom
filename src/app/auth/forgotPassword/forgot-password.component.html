<main class="forgot-shell">
  <section class="forgot-card">
    <div class="forgot-card__header">
      <p class="eyebrow">Recuperación de acceso</p>
      <h1>¿Olvidaste tu contraseña?</h1>
      <p>
        Captura el correo electrónico asociado a tu cuenta y te enviaremos un enlace
        para restablecer tu contraseña.
      </p>
    </div>

    <form class="forgot-form">
      <label class="field">
        <span>Correo electrónico</span>
        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="nombre@empresa.com"
        />
      </label>

      <button
        type="button"
        class="submit-button"
        [disabled]="isSubmitting"
        (click)="submitForgotPassword()"
      >
        {{ isSubmitting ? 'Enviando...' : 'Recuperar contraseña' }}
      </button>

      <a routerLink="/auth/login" class="back-button">Volver a inicio</a>
    </form>
  </section>
</main>
