<div class="modal-backdrop" (click)="cancel()"></div>

<div class="modal">
  <header class="modal__header">
    <h2>Agregar rol</h2>
    <button class="modal__close" type="button" (click)="cancel()" aria-label="Cerrar">&#x2715;</button>
  </header>

  <form class="modal__body" [formGroup]="form" (ngSubmit)="save()">
    <div class="field">
      <label class="field__label" for="role-name">Nombre <span class="field__required">*</span></label>
      <input
        id="role-name"
        class="field__input"
        type="text"
        formControlName="name"
        placeholder="Ej. Supervisor"
        autocomplete="off"
      />
      @if (form.get('name')?.invalid && form.get('name')?.touched) {
        <p class="field__error">El nombre es obligatorio (mínimo 2 caracteres).</p>
      }
    </div>

    <div class="field">
      <label class="field__label" for="role-desc">Descripción</label>
      <textarea
        id="role-desc"
        class="field__input field__input--textarea"
        formControlName="description"
        rows="3"
        placeholder="Breve descripción del rol..."
      ></textarea>
    </div>

    <div class="field field--inline">
      <label class="field__label" for="role-active">Activo</label>
      <label class="toggle">
        <input id="role-active" type="checkbox" formControlName="active" />
        <span class="toggle__track"></span>
      </label>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--ghost" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn--primary" type="submit" [disabled]="form.invalid || saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </form>
</div>
