<div class="modal-backdrop" (click)="cancel()"></div>

<div class="modal">
  <header class="modal__header">
    <div>
      <p class="modal__eyebrow">Catálogo</p>
      <h2 class="modal__title">Agregar equipo</h2>
    </div>
    <button class="modal__close" type="button" (click)="cancel()" aria-label="Cerrar">&#x2715;</button>
  </header>

  <form class="modal__body" [formGroup]="form" (ngSubmit)="submit()">

    <div class="form-row">
      <div class="field">
        <label class="field__label" for="eq-name">Nombre <span class="field__required">*</span></label>
        <input id="eq-name" class="field__input" type="text" formControlName="name" autocomplete="off" />
        @if (isFieldInvalid('name')) {
          <p class="field__error">El nombre es obligatorio (mínimo 2 caracteres).</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="eq-identifier">Identificador <span class="field__required">*</span></label>
        <input id="eq-identifier" class="field__input" type="text" formControlName="identifier" autocomplete="off" />
        @if (isFieldInvalid('identifier')) {
          <p class="field__error">El identificador es obligatorio.</p>
        }
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field__label" for="eq-brand">Marca</label>
        <input id="eq-brand" class="field__input" type="text" formControlName="brand" autocomplete="off" />
      </div>

      <div class="field">
        <label class="field__label" for="eq-model">Modelo</label>
        <input id="eq-model" class="field__input" type="text" formControlName="model" autocomplete="off" />
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field__label" for="eq-ns">NS <span class="field__required">*</span></label>
        <input id="eq-ns" class="field__input" type="text" formControlName="ns" autocomplete="off" />
        @if (isFieldInvalid('ns')) {
          <p class="field__error">El número de serie es obligatorio.</p>
        }
      </div>

      <div class="field">
        <label class="field__label" for="eq-range">Rango</label>
        <input id="eq-range" class="field__input" type="text" formControlName="range" autocomplete="off" />
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field__label" for="eq-frecuency">Frecuencia</label>
        <input id="eq-frecuency" class="field__input" type="text" formControlName="frecuency" autocomplete="off" />
      </div>

      <div class="field">
        <label class="field__label" for="eq-precition">Precisión</label>
        <input id="eq-precition" class="field__input" type="text" formControlName="precition" autocomplete="off" />
      </div>
    </div>

    <div class="form-row">
      <div class="field">
        <label class="field__label" for="eq-specify">Especificar equipo</label>
        <input id="eq-specify" class="field__input" type="text" formControlName="especify_equipment" autocomplete="off" />
      </div>

      <div class="field">
        <label class="field__label" for="eq-voltage">Voltaje</label>
        <select id="eq-voltage" class="field__input" formControlName="voltage">
          <option value="">Selecciona un voltaje</option>
          <option value="25V">25V</option>
          <option value="50V">50V</option>
        </select>
      </div>
    </div>

    <div class="field field--inline">
      <span class="field__label">Activo</span>
      <label class="toggle">
        <input type="checkbox" formControlName="active" />
        <span class="toggle__track"></span>
      </label>
    </div>

    <footer class="modal__footer">
      <button class="btn btn--ghost" type="button" (click)="cancel()">Cancelar</button>
      <button class="btn btn--primary" type="submit" [disabled]="saving()">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
    </footer>
  </form>
</div>
